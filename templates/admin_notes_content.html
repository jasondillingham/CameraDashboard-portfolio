{{define "admin_notes_content.html"}}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>Project Notes</span>
        <span class="small" style="color: rgba(255,255,255,0.4);">Source: notes.md</span>
    </div>
    <div class="card-body notes-content">
        {{.NotesHTML}}
    </div>
</div>

<style>
    .notes-content {
        max-width: 900px;
        line-height: 1.7;
        color: rgba(255,255,255,0.85);
    }
    .notes-content h1 {
        color: #fff;
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid rgba(139, 92, 246, 0.3);
    }
    .notes-content h2 {
        color: #06b6d4;
        font-size: 1.3rem;
        font-weight: 700;
        margin-top: 30px;
        margin-bottom: 15px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .notes-content h3 {
        color: #a78bfa;
        font-size: 1.1rem;
        font-weight: 600;
        margin-top: 24px;
        margin-bottom: 10px;
    }
    .notes-content p {
        margin-bottom: 10px;
        color: rgba(255,255,255,0.7);
    }
    .notes-content ul {
        margin: 8px 0 12px;
        padding-left: 20px;
    }
    .notes-content li {
        margin-bottom: 4px;
        color: rgba(255,255,255,0.7);
    }
    .notes-content code {
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 4px;
        padding: 1px 6px;
        font-family: monospace;
        font-size: 0.88rem;
        color: #4ade80;
    }
    .notes-content ol {
        margin: 8px 0 12px;
        padding-left: 20px;
    }
</style>
{{end}}
